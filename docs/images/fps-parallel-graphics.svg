<text x="616.0" y="285.7" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">81</text>
<text x="584.0" y="392" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">Village</text>
<text x="584.0" y="410" font-size="12" fill="#52514e" text-anchor="middle">+25 %</text>
<path d="M724.0,370 V322.0 Q724.0,318.0 728.0,318.0 H776.0 Q780.0,318.0 780.0,322.0 V370 Z" fill="#2a78d6"/>
<text x="752.0" y="311.0" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">54.5</text>
<path d="M788.0,370 V311.5 Q788.0,307.5 792.0,307.5 H840.0 Q844.0,307.5 844.0,311.5 V370 Z" fill="#eb6834"/>
<text x="816.0" y="300.5" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">65.5</text>
<text x="784.0" y="392" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">Home</text>
<text x="784.0" y="410" font-size="12" fill="#52514e" text-anchor="middle">+20 %</text>
</svg>